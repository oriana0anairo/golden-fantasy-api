# Blueprint de Render. En Railway no hace falta este archivo:
# se configuran los mismos comandos y variables desde el panel.
services:
  - type: web
    name: golden-fantasy-api
    runtime: node
    plan: free
    # `--include=dev`: NODE_ENV=production hace que npm omita las
    # devDependencies, y el build necesita TypeScript y los @types.
    # Las migraciones y el seed van acá porque el plan free no tiene
    # preDeployCommand ni acceso a shell. El seed es seguro de repetir:
    # si el admin ya existe, no lo toca.
    buildCommand: npm ci --include=dev && npm run build && npm run db:deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # El resto se configuran a mano en el panel (son secretos):
      # DATABASE_URL, DIRECT_URL, JWT_SECRET, CORS_ORIGIN
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Crean el admin dueño en el primer deploy (no hay registro de admin).
      - key: ADMIN_OWNER_NAME
        sync: false
      - key: ADMIN_OWNER_EMAIL
        sync: false
      - key: ADMIN_OWNER_PASSWORD
        sync: false
